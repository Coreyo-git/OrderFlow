# Lint, build, and test the solution on every push/PR to master.
# Docker build/push and deploy steps will be added once we get to that stage.

name: .NET CI

on:
  push:
    branches: ["master"]
    paths:
      - "src/**"
      - "tests/**"
      - "OrderFlow.sln"
      - ".editorconfig"
      - ".github/workflows/dotnet.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "src/**"
      - "tests/**"
      - "OrderFlow.sln"
      - ".editorconfig"
      - ".github/workflows/dotnet.yml"

jobs:
  lint-build-test:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Lint (verify formatting)
        run: dotnet format --verify-no-changes

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release
